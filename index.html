  <div class="flex gap-2 mt-3"><button data-act="kickall" class="flex-1 flex items-center justify-center gap-1.5 rounded-lg py-2 text-sm border border-red-300 text-red-600 hover:bg-red-50">${ic("logout")}အားလုံး ဖြုတ်ချမည်</button>${sb ? "" : `<button data-act="sim-dev" class="flex-1 flex items-center justify-center gap-1.5 rounded-lg py-2 text-sm border border-dashed border-indigo-300 text-indigo-700 hover:bg-indigo-50">${ic("flask")}စက်အသစ် ဝင်လာသည်ဟု စမ်းမည်</button>`}</div>
  <p class="text-xs text-slate-400 mt-2">ကန့်သတ်ချက်ထက် များနေရင် နောက်မှ ဝင်လာတဲ့ စက်တွေ POS မှာ "စက်အရေအတွက် ပြည့်နေပါသည်" ပြပြီး ဝင်မရပါ။ ဖြုတ်ချရင် POS မှ စက္ကန့် ၁၀ အတွင်း ထွက်သွားပါမည်။</p>${featNote("sess")}</section>

  <section class="${cls.card} rise space-y-4" style="--i:3"><h2 class="font-semibold flex items-center gap-2">${ic("sliders", "w-5 h-5 text-slate-500")}Quick Controls</h2>

  <div class="flex gap-2"><input id="months" type="number" min="1" value="${st.months}" class="w-20 border rounded-lg px-2 py-2 bg-white"><span class="self-center text-sm">လ</span><input id="amount" type="number" value="${st.amount}" class="flex-1 min-w-0 border rounded-lg px-2 py-2 bg-white"></div>
  <button data-act="renew" class="${btn} w-full bg-emerald-600 hover:bg-emerald-700 text-white" id="renewBtn">${ic("wallet")}<span id="renewTxt">ငွေလက်ခံ + ${st.months} လ တိုးမည်</span></button></div>

  <div class="flex gap-2"><input id="fee" type="number" value="${st.fee}" class="flex-1 min-w-0 border rounded-lg px-2 py-2 bg-white"><button data-act="setfee" class="${btn} px-3 border hover:bg-slate-50">${ic("tag")}ကြေးနှုန်းပြောင်း</button></div>

  <section class="${cls.card} rise" style="--i:3"><h2 class="font-semibold mb-2 flex items-center gap-2">${ic("receipt", "w-5 h-5 text-slate-500")}ကြေးပေးသွင်းမှတ်တမ်း<a href="#history" data-act="hist-shop" data-id="${s.id}" class="ml-auto text-xs font-normal text-indigo-600 hover:underline">မှတ်တမ်းအားလုံး →</a></h2>${pays.length ? "" : `<p class="text-sm text-slate-500 flex items-center gap-2">${ic("receipt", "w-4 h-4 text-slate-400")}မရှိသေးပါ</p>`}
  <ul class="divide-y text-sm">${pays.map((p) => `<li class="py-2 flex items-center gap-3">${chip("coins", "bg-emerald-50 text-emerald-600", "w-8 h-8")}<span class="flex-1 min-w-0">${date(p.paid_at)} · ${p.months} လ${p.plan_name ? " · " + esc(p.plan_name) : ""}${p.method ? " · " + esc(p.method) : ""}<span class="block text-xs text-slate-400 truncate">${ic("user", "w-3 h-3 inline mr-0.5")}${p.admin_email ? esc(p.admin_email) : "—"}${p.note ? " · " + esc(p.note) : ""}</span></span><b>${fmt(p.amount)}</b></li>`).join("")}</ul></section></div>`;
}


function historyView() {
  const hf = S.hf || "all", hr = S.hr || "all", list = historyList();
  const pays = list.filter((x) => x.kind === "pay"), total = pays.reduce((a, x) => a + (+x.amount || 0), 0);
  const tile = (l, v, c, i) => `<div class="rise bg-white rounded-xl p-3 shadow-sm" style="--i:${i}"><p class="text-xs text-slate-500">${l}</p><p class="text-lg font-bold ${c}">${v}</p></div>`;
  const chipB = (on, act, v, label, icn) => `<button data-act="${act}" data-v="${v}" class="flex items-center gap-1.5 pl-2.5 pr-3 py-1.5 rounded-full whitespace-nowrap border text-sm font-medium ${on ? "bg-indigo-600 text-white border-indigo-600 shadow-sm" : "bg-white text-slate-700 hover:bg-slate-50"}">${icn ? ic(icn) : ""}${label}</button>`;
  return `<div class="space-y-4"><div class="rise flex items-center justify-between gap-2"><h1 class="text-xl font-bold flex items-center gap-2">${ic("receipt", "w-6 h-6 text-indigo-600")}မှတ်တမ်း (Audit Log)</h1>
  <button data-act="export-csv" class="wig flex items-center gap-1.5 border bg-white hover:bg-slate-50 text-sm rounded-lg px-3 py-2">${ic("download")}CSV</button></div>
  ${featNote("audit")}
  <div class="grid grid-cols-3 gap-2">${tile("ကောက်ခံငွေ", fmt(total), "text-emerald-600", 1)}${tile("ကြေးသွင်းအကြိမ်", pays.length, "text-indigo-600", 2)}${tile("မှတ်တမ်း စုစုပေါင်း", list.length, "text-slate-800", 3)}</div>
  <div class="rise flex flex-wrap gap-2 items-center" style="--i:4"><select id="hs" class="border rounded-lg px-2 py-1.5 bg-white text-sm max-w-[55%]"><option value="">ဆိုင်အားလုံး</option>${[...S.shops].sort((a, b) => a.name.localeCompare(b.name)).map((x) => `<option value="${x.id}" ${String(S.hs) === String(x.id) ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>
  ${[["all", "အချိန်အားလုံး"], ["month", "ဒီလ"], ["30", "ရက် ၃၀"]].map(([k, l]) => chipB(hr === k, "hr", k, l)).join("")}</div>
  <div class="rise flex gap-2 overflow-x-auto pb-1" style="--i:5">${HF.map(([k, l, i]) => chipB(hf === k, "hf", k, l, i)).join("")}</div>
  <ul class="space-y-2">${list.slice(0, 200).map((x, i) => { const m = AUD[x.kind] || AUD.fee; const sub = x.kind === "pay" ? `${x.months} လ${x.plan ? " · " + esc(x.plan) : ""}${x.method ? " · " + esc(x.method) : ""}${x.note ? " · " + esc(x.note) : ""}` : esc(x.detail || "");
    return `<li class="rise bg-white rounded-xl shadow-sm p-3 flex gap-3" style="--i:${Math.min(i, 10) + 6}">${chip(m[0], m[1])}<div class="flex-1 min-w-0"><div class="flex justify-between items-start gap-2"><p class="text-sm font-medium">${m[2]}${x.shop_name ? ` · <a href="#shop-${x.shop_id}" class="text-indigo-600 hover:underline">${esc(x.shop_name)}</a>` : ""}</p>${x.kind === "pay" ? `<b class="text-emerald-600 text-sm whitespace-nowrap">${fmt(x.amount)}</b>` : ""}</div>
    ${sub ? `<p class="text-xs text-slate-500">${sub}</p>` : ""}<p class="text-xs text-slate-400 flex items-center gap-1 flex-wrap mt-0.5">${ic("cal", "w-3 h-3")}${dt(x.t)}<span>·</span>${ic("user", "w-3 h-3")}${x.admin ? esc(x.admin) : "—"}</p></div></li>`; }).join("")}</ul>
  ${list.length ? "" : empty("receipt", "မှတ်တမ်း မရှိသေးပါ")}</div>`;
}

function plansView() {
  const ps = S.plans || [];
  return `<div class="space-y-4"><div class="rise flex items-center justify-between"><h1 class="text-xl font-bold flex items-center gap-2">${ic("tag", "w-6 h-6 text-indigo-600")}Plans / Packages</h1>
  <button data-act="open-plan" class="wig flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg px-3 py-2 shadow-sm">${ic("plus")}Plan အသစ်</button></div>
  ${featNote("plans")}<p class="rise text-sm text-slate-500" style="--i:1">ဈေးနှုန်း၊ သက်တမ်းကာလ၊ ခွင့်ပြုမည့် စက်အရေအတွက်ကို package အလိုက် သတ်မှတ်ပါ။ ဆိုင်ဖွင့်ပေးချိန် / ကြေးသွင်းချိန်မှာ Plan ရွေးရုံနဲ့ ကြေး၊ ရက်၊ စက်ကန့်သတ်ချက် အလိုအလျောက် ဖြည့်ပေးပါမည်။</p>
  <div class="grid sm:grid-cols-2 gap-3">${ps.map((p, i) => { const used = S.shops.filter((x) => String(x.plan_id) === String(p.id)).length;
    return `<div class="lift rise bg-white rounded-2xl shadow-sm p-4 ${p.active === false ? "opacity-60" : ""}" style="--i:${i + 2}"><div class="flex items-start justify-between gap-2"><div class="flex items-center gap-2.5">${chip("tag", "bg-violet-100 text-violet-600")}<div><p class="font-semibold">${esc(p.name)}</p><p class="text-xs text-slate-500">${used} ဆိုင် သုံးနေ</p></div></div>${p.active === false ? pill("bg-slate-200 text-slate-600", "ပိတ်ထား") : pill("bg-emerald-100 text-emerald-800", "သုံးနိုင်")}</div>
    <p class="text-2xl font-bold text-indigo-600 mt-3">${fmt(p.price)} <span class="text-sm font-normal text-slate-500">/ ${p.months} လ</span></p>
    <div class="flex flex-wrap gap-2 mt-2 text-xs text-slate-600"><span class="inline-flex items-center gap-1 bg-slate-100 rounded-full px-2 py-1">${ic("phone", "w-3 h-3")}စက် ${p.max_devices} လုံး</span><span class="inline-flex items-center gap-1 bg-slate-100 rounded-full px-2 py-1">${ic("cal", "w-3 h-3")}${p.months * 30} ရက်</span><span class="inline-flex items-center gap-1 bg-slate-100 rounded-full px-2 py-1">${ic("coins", "w-3 h-3")}${fmt(Math.round(p.price / p.months))}/လ</span></div>
    ${p.note ? `<p class="text-xs text-slate-500 mt-2">${esc(p.note)}</p>` : ""}
    <div class="flex gap-2 mt-3"><button data-act="edit-plan" data-id="${p.id}" class="flex-1 flex items-center justify-center gap-1.5 border rounded-lg py-1.5 text-sm hover:bg-slate-50">${ic("edit")}ပြင်မည်</button><button data-act="toggle-plan" data-id="${p.id}" class="flex-1 flex items-center justify-center gap-1.5 border rounded-lg py-1.5 text-sm hover:bg-slate-50">${ic(p.active === false ? "play" : "power")}${p.active === false ? "ဖွင့်မည်" : "ပိတ်မည်"}</button><button data-act="del-plan" data-id="${p.id}" class="px-3 border border-red-300 text-red-600 rounded-lg hover:bg-red-50" aria-label="ဖျက်မည်">${ic("trash")}</button></div></div>`; }).join("")}</div>
  ${ps.length ? "" : empty("tag", "Plan မရှိသေးပါ — + Plan အသစ် နှိပ်ပါ")}</div>`;
}

/* ---------- modals ---------- */
function modalHtml() {
  const m = S.modal; if (!m) return "";
  const an = S.modalNew;
  const wrap = (inner) => `<div data-act="close" class="${an ? "m-bd " : ""}fixed inset-0 bg-black/40 grid place-items-end sm:place-items-center z-20" data-backdrop><div class="${an ? "m-sheet " : ""}bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-3 max-h-[90vh] overflow-y-auto pb-[max(20px,env(safe-area-inset-bottom))]">${inner}</div></div>`;
  const B = "flex-1 flex items-center justify-center gap-1.5 rounded-lg py-2";
  if (m.type === "confirm") return wrap(`<div class="flex items-start gap-3">${chip("alert", "bg-red-100 text-red-600")}<p class="font-medium whitespace-pre-line pt-1.5">${esc(m.text)}</p></div><div class="flex gap-2"><button data-act="close" class="${B} border hover:bg-slate-50">${ic("back")}မလုပ်တော့</button><button data-act="confirm-yes" class="${B} bg-red-600 hover:bg-red-700 text-white">${ic("check")}အတည်ပြုမည်</button></div>`);
  if (m.type === "approve") {
    const s = S.shops.find((x) => x.id === m.id);
    return wrap(`<h2 class="font-bold flex items-center gap-2">${chip("check", "bg-emerald-100 text-emerald-600", "w-9 h-9")}Approve - ${esc(s.name)}</h2>
    <label class="block text-sm">Initial Status<select id="ap-status" class="${cls.inp}"><option value="trial" ${m.status === "trial" ? "selected" : ""}>Trial</option><option value="active" ${m.status === "active" ? "selected" : ""}>Active</option></select></label>
    <label class="block text-sm">Plan<select id="ap-plan" class="${cls.inp}"><option value="">Plan မရွေး (ကိုယ်တိုင်သတ်မှတ်)</option>${(S.plans || []).filter((p) => p.active !== false).map((p) => `<option value="${p.id}" ${String(m.plan) === String(p.id) ? "selected" : ""}>${esc(p.name)} · ${fmt(p.price)}/${p.months}လ · စက် ${p.max_devices}</option>`).join("")}</select></label>
    <div class="flex gap-2 text-sm"><button data-act="ap-mode" data-v="days" class="flex-1 flex items-center justify-center gap-1.5 py-1.5 rounded-lg border ${m.mode === "days" ? "bg-indigo-600 text-white" : ""}">${ic("clock")}ရက်အရေအတွက်</button><button data-act="ap-mode" data-v="date" class="flex-1 flex items-center justify-center gap-1.5 py-1.5 rounded-lg border ${m.mode === "date" ? "bg-indigo-600 text-white" : ""}">${ic("cal")}ကုန်မည့်ရက်</button></div>
    ${m.mode === "days" ? `<div><input id="ap-days" type="number" min="1" class="w-full border rounded-lg px-3 py-2" value="${m.days}"><div class="flex gap-2 mt-2 text-xs">${[7, 14, 30, 90, 365].map((d) => `<button data-act="ap-days" data-v="${d}" class="px-2 py-1 bg-slate-100 hover:bg-indigo-100 rounded">${d}ရက်</button>`).join("")}</div></div>` : `<input id="ap-date" type="date" class="w-full border rounded-lg px-3 py-2" value="${m.date}">`}
    <label class="block text-sm">လစဉ်ကြေး (ကျပ်)<input id="ap-fee" type="number" class="${cls.inp}" value="${m.fee}"></label>
    ${m.status === "active" ? `<label class="flex items-center gap-2 text-sm"><input id="ap-paid" type="checkbox" ${m.paid ? "checked" : ""}> ပထမလစဉ်ကြေး ရရှိပြီး (မှတ်တမ်းတင်မည်)</label>` : ""}
    <div class="flex gap-2"><button data-act="close" class="${B} border hover:bg-slate-50">${ic("xc")}မလုပ်တော့</button><button data-act="approve" class="${B} bg-emerald-600 hover:bg-emerald-700 text-white">${ic("check")}ဖွင့်ပေးမည်</button></div>`);
  }
  if (m.type === "plan") { const p = m.p || {}; return `<div data-act="close" class="${an ? "m-bd " : ""}fixed inset-0 bg-black/40 grid place-items-end sm:place-items-center z-20" data-backdrop><form data-form="plan" class="${an ? "m-sheet " : ""}bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-2 max-h-[90vh] overflow-y-auto pb-[max(20px,env(safe-area-inset-bottom))]"><h2 class="font-bold flex items-center gap-2">${chip("tag", "bg-violet-100 text-violet-600", "w-9 h-9")}${m.p ? "Plan ပြင်မည်" : "Plan အသစ်"}</h2>
    <label class="block text-sm">Plan အမည်<input id="pl-name" required value="${esc(p.name || "")}" placeholder="ဥပမာ - Standard" class="${cls.inp}"></label>
    <div class="grid grid-cols-2 gap-2"><label class="block text-sm">ဈေးနှုန်း (ကျပ်)<input id="pl-price" type="number" min="0" required value="${p.price ?? 30000}" class="${cls.inp}"></label><label class="block text-sm">သက်တမ်း (လ)<input id="pl-months" type="number" min="1" required value="${p.months ?? 1}" class="${cls.inp}"></label></div>
    <label class="block text-sm">ခွင့်ပြုမည့် စက် (device) အရေအတွက်<input id="pl-dev" type="number" min="1" required value="${p.max_devices ?? 3}" class="${cls.inp}"></label>

function countUp() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll("[data-n]").forEach((el) => {
    const n = +el.dataset.n, m = el.dataset.m, t0 = performance.now(), D = 800;
    const f = (t) => { const p = Math.min(1, (t - t0) / D), v = Math.round(n * (1 - Math.pow(1 - p, 3))); el.textContent = m ? fmt(v) : v; if (p < 1 && el.isConnected) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  });
}
function render() {
  const a = S.anim; S.anim = false;

    app.innerHTML = shell(body);

}

    return ask(`Session ${act.length} ခုလုံး ဖြုတ်ချမည်လား?\nစက်အားလုံး POS မှ ထွက်သွားမည် (ပြန်ဝင်လျှင် ပြန်ဝင်နိုင်သည်)။`, () => { act.forEach((x) => (x.revoked = true)); persist(() => sb.from("shop_sessions").update({ revoked: true }).eq("shop_id", String(s.id)).eq("revoked", false)); logA(s, "kick", `Session ${act.length} ခု အားလုံး ဖြုတ်ချ`); toast("အားလုံး ဖြုတ်ချပြီး"); });
  }
  if (a === "sim-dev") { (S.sess[String(s.id)] ||= []).push({ id: Date.now(), shop_id: String(s.id), user_name: "ဧည့်စက်", role: "cashier", device_label: ["iPhone", "Android Phone", "Windows PC"][Math.floor(Math.random() * 3)], first_seen: iso(0), last_seen: iso(0), revoked: false, live: true }); toast("စက်အသစ် ဝင်လာပြီ"); return render(); }
  if (a === "staff") {
    const m = S.staff[s.id].find((x) => x.id === id);
    const flip = () => { m.banned = !m.banned; logA(s, m.banned ? "ban" : "unban", `${m.name} (${m.role}) အကောင့် ${m.banned ? "ပိတ်" : "ပြန်ဖွင့်"}`); persist(() => sb.from("shop_members").update({ banned: m.banned }).eq("user_id", m.id).eq("shop_id", s.id)); toast(m.banned ? "ပိတ်ပြီး — POS မှ စက္ကန့် ၁၀ အတွင်း ထွက်သွားမည်" : "ပြန်ဖွင့်ပြီး — POS မှ ချက်ချင်း ပြန်ဝင်နိုင်မည်"); };
    return m.banned ? (flip(), render()) : ask(`${m.name} ၏ အကောင့်ကို ပိတ်မည်လား?\nလော့ဂ်အင်ဝင်၍ မရတော့ပါ။`, flip);
  }
  if (a === "renew") {
    const months = +$("months").value || 1, amount = +$("amount").value || 0;
    const pl = (S.plans || []).find((p) => String(p.id) === ($("plan")?.value || ""));
    const pay = { shop_id: s.id, months, amount, admin_email: S.email || "admin@example.com", plan_name: pl ? pl.name : null, method: $("method")?.value || "", note: ($("note")?.value || "").trim() || null };
    addDays(s, months * 30); if (s.status === "pending") s.status = "active";
    if (pl) { s.plan_id = pl.id; s.max_devices = pl.max_devices; s.monthly_fee = Math.round(pl.price / pl.months); }
    (S.pays[s.id] ||= []).push({ id: "p" + Date.now(), paid_at: iso(0), ...pay });
    persist(async () => { const r = await sb.from("shops").update(shopPatch(s)).eq("id", s.id); if (r.error) return r; if (pl) await sb.from("shops").update({ plan_id: pl.id, max_devices: pl.max_devices }).eq("id", s.id); return insertPayment(pay); });
    S.form = null; toast(`${months} လ တိုးပြီး`); burst(`${months} လ တိုးပြီး`); return render();
  }
  if (a === "extend") { addDays(s, +v); logA(s, "extend", `+${v} ရက် (အခမဲ့) → ${date(s.expires_at)}`); persist(() => sb.from("shops").update(shopPatch(s)).eq("id", s.id)); toast(`+${v} ရက် တိုးပြီး`); return render(); }
  if (a === "setfee") { s.monthly_fee = +$("fee").value || 0; logA(s, "fee", `လစဉ်ကြေး → ${fmt(s.monthly_fee)}`); persist(() => sb.from("shops").update(shopPatch(s)).eq("id", s.id)); S.form = null; toast("ကြေးနှုန်း ပြောင်းပြီး"); return render(); }
  if (a === "suspend") return ask("ဤဆိုင်ကို ချက်ချင်း ပိတ်သိမ်းမည်လား?", () => { s.status = "suspended"; logA(s, "suspend", "ပိတ်သိမ်း"); persist(() => sb.from("shops").update(shopPatch(s)).eq("id", s.id)); toast("ပိတ်သိမ်းပြီး — POS မှာ စက္ကန့် ၁၀ အတွင်း ပိတ်သွားမည်"); });
  if (a === "reactivate") { s.status = "active"; logA(s, "reactivate", "ပြန်ဖွင့်"); persist(() => sb.from("shops").update(shopPatch(s)).eq("id", s.id)); toast("ပြန်ဖွင့်ပြီး — POS မှာ ချက်ချင်း ပြန်သုံးနိုင်မည်"); burst("ပြန်ဖွင့်ပြီး"); return render(); }
});

setInterval(pollPresence, 8000);
setInterval(() => { if (S.authed) loadUsage(); }, 60000);
route();
if (sb) sb.auth.getSession().then(async ({ data }) => {
  const u = data.session && data.session.user; if (!u) return;
  const { data: sa } = await sb.from("super_admins").select("user_id").eq("user_id", u.id).maybeSingle();
  if (sa) { S.email = u.email; await load(); S.authed = true; render(); loadUsage(); }
});
</script>

</body></html>
